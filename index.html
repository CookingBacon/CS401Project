<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashMath</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <div class="top-left">
            <span id="timer">Time: 60</span>
            <span id="score">Score: 0</span>
            <span id="lives">&#9829;&#9829;&#9829;</span>
        </div>
    </div>

    <div class="title">Fla<span class="bolt">&#9889;</span>hMath</div>

    <div class="question-container">
        <p id="question"></p>
        <p id="feedback"></p>
    </div>

    <div class="bottom-bar">
        <input type="number" id="answer" step="0.1" placeholder="?" disabled>
        <button id="start-btn">Start</button>
        <button id="pass-btn" disabled>Pass</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
